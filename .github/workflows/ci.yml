name: Check NOVA Kiosk Agent

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: agent-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check formatting, vet and tests
        env:
          GOTOOLCHAIN: local
        run: |
          test -z "$(gofmt -l cmd cupsjob cupsreconcile enrollment operations printer)"
          go vet ./...
          go test -race ./...
