name: Release NOVA Kiosk Agent

on:
  push:
    paths:
      - VERSION
      - .github/workflows/release.yml
      - .github/scripts/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      build: ${{ steps.version.outputs.build }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check whether this version needs a release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.version.outputs.build == 'true'
        with:
          go-version-file: go.mod
      - name: Install TPM test simulator
        if: steps.version.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends swtpm openssl
      - name: Check and package Linux x86_64
        if: steps.version.outputs.build == 'true'
        env:
          GOTOOLCHAIN: local
        run: |
          test -z "$(gofmt -l .)"
          command -v swtpm openssl
          go vet ./...
          go test -race ./...
          bash .github/scripts/build-release.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.version.outputs.build == 'true'
        with:
          name: release-files
          path: |
            dist/novakiosk-agent-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: agent-publish-${{ needs.build.outputs.version }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/release.py
            VERSION
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-files
          path: dist
      - name: Upload draft assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py publish
